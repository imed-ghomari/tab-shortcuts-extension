<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tab Shortcuts</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  font-size: 14px;
  color: #1a1a1a;
  background: #fff;
  width: 100%;
  height: 100vh;
  overflow: hidden;
}
.dialog { padding: 20px; }
h2 {
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 16px;
  color: #202124;
}
input[type="text"] {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid #dadce0;
  border-radius: 8px;
  font-size: 14px;
  outline: none;
  transition: border-color 0.15s;
}
input[type="text"]:focus {
  border-color: #1a73e8;
  box-shadow: 0 0 0 2px rgba(26,115,232,0.15);
}
.buttons {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
  margin-top: 16px;
}
button {
  padding: 8px 20px;
  border: none;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.15s;
}
#cancelBtn {
  background: transparent;
  color: #5f6368;
}
#cancelBtn:hover { background: #f1f3f4; }
#saveBtn {
  background: #1a73e8;
  color: #fff;
}
#saveBtn:hover { background: #1765cc; }
#groupList {
  list-style: none;
  margin-top: 8px;
  max-height: 380px;
  overflow-y: auto;
}
#groupList li {
  padding: 10px 12px;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.1s;
  margin-bottom: 2px;
}
#groupList li:hover { background: #e8f0fe; }
#groupList li.selected {
  background: #e8f0fe;
  color: #174ea6;
}
#groupList li.create-new {
  color: #1a73e8;
  font-weight: 500;
}
#groupList li.create-new:hover { background: #e8f0fe; }
.empty-msg {
  color: #80868b;
  text-align: center;
  padding: 20px;
  font-size: 13px;
}
#moveError {
  color: #d93025;
  font-size: 12px;
  margin-top: 8px;
  white-space: pre-wrap;
}
</style>
</head>
<body>
<div id="app" class="dialog"></div>
<script src="dialog.js"></script>
</body>
</html>
